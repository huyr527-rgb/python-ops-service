apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ops-demo
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
    receivers:
      - name: default
