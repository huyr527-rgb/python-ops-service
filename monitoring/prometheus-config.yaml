apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ops-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: python-ops-service
        metrics_path: /metrics
        static_configs:
          - targets: ["python-ops-service.ops-demo.svc.cluster.local:8000"]
