name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/python-ops-service

jobs:
  validate:
    name: Validate application and manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest -q

      - name: Compile application
        run: python -m compileall -q app

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [path for path in Path('.').rglob('*.yaml') if '.git' not in path.parts]
          documents = 0
          for path in paths:
              documents += sum(1 for document in yaml.safe_load_all(path.read_text(encoding='utf-8')) if document is not None)
          print(f"Validated {len(paths)} YAML files and {documents} documents")
          PY

      - name: Render cloud deployment
        run: kubectl kustomize deploy/overlays/cloud > /tmp/python-ops-service.yaml

  image:
    name: Build, scan, publish, and promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

      - name: Promote image tag in GitOps overlay
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          kustomization = Path("deploy/overlays/cloud/kustomization.yaml")
          content = kustomization.read_text(encoding="utf-8")
          content = re.sub(r"(?m)^(\s*newTag:)\s*.*$", rf"\1 {tag}", content)
          kustomization.write_text(content, encoding="utf-8")

          version_patch = Path("deploy/overlays/cloud/app-version-patch.yaml")
          content = version_patch.read_text(encoding="utf-8")
          content = re.sub(r"(?m)^(\s*value:)\s*.*$", rf"\1 {tag}", content)
          version_patch.write_text(content, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/cloud/kustomization.yaml deploy/overlays/cloud/app-version-patch.yaml
          git diff --cached --quiet || git commit -m "ci: promote ${IMAGE_TAG} to cloud overlay [skip ci]"
          git push origin HEAD:main
